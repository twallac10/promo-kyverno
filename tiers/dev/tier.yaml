# TIER-ONLY (dev): never promoted. Replicas, retention, enforcement mode, remediation.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  upgrade:
    # onFailure: hold. No remediation, so a failed release stays up to debug.
    remediation:
      retries: 0
      remediateLastFailure: false
  values:
    behaviour:
      tier: dev
